name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check bench/compare.mjs && node bench/compare.mjs 40 1800 && node bench/compare.mjs 120 6000
      - run: node --check bench/matchup.mjs && node bench/matchup.mjs 4 7900 strategic-plus strategic && node bench/matchup.mjs 4 7901 joker-safe exact
      - run: node bench/matchup.mjs 40 10000 strategic-plus strategic && node bench/matchup.mjs 40 10100 joker-safe greedy
      - run: node --check app.js && node --check draft.js && node --check hold.js && node --check sound.js && node --check tile-layout.js && node --check spectator.js && node --check matchup.js && node --check engine.js
      - run: node --check research/global-cover.js && node --check research/belief-search.js && node --check research/policy.js && node --check bench/train-exit.mjs
      - run: node bench/train-exit.mjs 4 51000 6
      - run: node bench/matchup.mjs 4 53000 global-cover strategic-plus && node bench/matchup.mjs 4 53010 belief-uct strategic-plus && node bench/matchup.mjs 4 53020 exit-apprentice strategic-plus
      - run: node scripts/check-site.mjs .
